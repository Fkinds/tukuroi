# The checks to run before each commit (#9), and on its message (#24). Install
# the Git hooks once with `uv run prek install`, and run every check on every
# file with `uv run prek run --all-files`. The local hooks run the tools of
# uv.lock, on the files that `make lint` checks.
minimum_prek_version = "0.5.10"
default_install_hook_types = ["pre-commit", "commit-msg"]
default_stages = ["pre-commit"]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "ruff-check"
name = "ruff check --fix"
entry = "uv run --locked ruff check --fix"
language = "system"
types = ["python"]
files = "^(src/tukuroi|scripts)/"

[[repos.hooks]]
id = "ruff-format"
name = "ruff format"
entry = "uv run --locked ruff format"
language = "system"
types = ["python"]
files = "^(src/tukuroi|scripts)/"

[[repos.hooks]]
id = "tukuroi-lint"
name = "tukuroi lint"
entry = "uv run --locked tukuroi lint"
language = "system"
types = ["python"]
files = "^(src/tukuroi|scripts)/"

[[repos.hooks]]
id = "copyright"
name = "copyright header"
entry = "uv run --locked python scripts/check_copyright.py"
language = "system"
types_or = ["python", "shell"]

# The workflows, by zizmor (#28): offline, with no token. CI runs it with the
# checks that ask GitHub too.
[[repos.hooks]]
id = "zizmor"
name = "zizmor"
entry = "uv run --locked zizmor --offline"
language = "system"
types = ["yaml"]
files = '^\.github/workflows/'

# Conventional Commits, as `[tool.commitizen]` of pyproject.toml has them.
[[repos.hooks]]
id = "commit-message"
name = "commit message"
entry = "uv run --locked cz check --allow-abort --commit-msg-file"
language = "system"
stages = ["commit-msg"]

# Built into prek: no download, and no environment to install.
[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace" },
    { id = "end-of-file-fixer" },
    { id = "mixed-line-ending" },
    { id = "check-toml" },
    { id = "check-yaml" },
    { id = "check-merge-conflict" },
    { id = "check-added-large-files" },
    { id = "detect-private-key" },
]
