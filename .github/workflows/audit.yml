name: Audit
# The known vulnerabilities of the dependencies and of the actions, each day:
# they come out with no change to this repository (#25). A run that finds one
# fails, and GitHub notifies whoever last changed the cron line below. Each
# change is checked by the audit job of CI (#173).
on:
  schedule:
    # 09:17 in Asia/Tokyo, off the hour, when GitHub has fewer runs to start.
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}

env:
  UV_LOCKED: "1"
  # The uv of CI, which builds the release too (#18).
  UV_VERSION: "0.13.10"

jobs:
  dependencies:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
          python-version: "3.14"
      - name: Audit
        # What uv.lock pins, with every extra and group, against osv.dev.
        # bash, for pipefail: the step fails with make, not with tee.
        shell: bash
        run: make audit 2>&1 | tee audit.txt
      - name: Summary
        # The report, on the page of the run.
        if: always()
        run: |
          {
            echo '```'
            cat audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  workflows:
    # The actions are pinned to commit SHAs, for which GitHub sends no alerts:
    # zizmor checks them against the advisories of GitHub, as the lint job of
    # CI does on each change.
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
          python-version: "3.14"
      - name: Install
        run: make SYNC= install
      - name: Workflows
        # The token reads public repositories only.
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run zizmor --format=github .github/workflows
