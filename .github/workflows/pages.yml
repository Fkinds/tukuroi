# The documentation on GitHub Pages: release.yml deploys it from the tag of
# each release, and a maintainer can deploy it by hand, from main or a tag. The
# site has the documentation of that one ref.
name: Pages

on:
  workflow_call:
  workflow_dispatch:

permissions: {}

# One deployment at a time; one that started finishes.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  UV_VERSION: "0.13.9"

jobs:
  build:
    runs-on: ubuntu-26.04
    # The inventories of intersphinx come from the network (#155).
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          # What is deployed is built from nothing that an earlier run left.
          enable-cache: false
          python-version: "3.14"
      - name: Install
        run: make install
      - name: Build
        run: make html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: html

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    # main and the tags v* only (.github/repository.yml).
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
