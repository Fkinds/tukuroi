name: Commits
# The messages of the commits of a pull request, and its title, are
# Conventional Commits, as `[tool.commitizen]` of pyproject.toml has them (#24).
# Apart from CI, so that editing the title runs this alone.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

# A new push, or a new title, cancels the run of the one before (#28).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  UV_LOCKED: "1"
  # The uv of CI, which builds the release too (#18).
  UV_VERSION: "0.13.5"

jobs:
  commits:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
      - name: Install
        run: make SYNC= install
      - name: Commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: uv run cz check --rev-range "$BASE..$HEAD"
      - name: Title
        # From the environment, not in the script: the title is anyone's text.
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: uv run cz check --message "$TITLE"
