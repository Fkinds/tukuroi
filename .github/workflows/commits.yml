name: Commits
# The messages of the commits of a pull request, and its title, are
# Conventional Commits, as `[tool.commitizen]` of pyproject.toml has them (#24).
# Apart from CI, so that editing the title runs this alone.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

# A new push, or a new title, cancels the run of the one before (#28).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  UV_LOCKED: "1"
  # The uv of CI, which builds the release too (#18).
  UV_VERSION: "0.13.7"

jobs:
  commits:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
      - name: Install
        run: make SYNC= install
      - name: Commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: uv run cz check --rev-range "$BASE..$HEAD"
      - name: Title
        # From the environment, not in the script: the title is anyone's text.
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: uv run cz check --message "$TITLE"
      - name: Autosquash
        # No commit of `git commit --fixup` or `--squash` goes into main, and no
        # title like theirs (#127): cz check lets them pass, as the hook does
        # while a pull request is in review. The messages and the title are
        # anyone's text, from the environment. git log runs apart from the
        # loop, so that its failure fails the step.
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          pattern='^(fixup|squash|amend)! '
          log=$(git log --format='%h %s' "$BASE..$HEAD")
          status=0
          while read -r commit subject; do
            if [[ $subject =~ $pattern ]]; then
              echo "::error::Commit $commit: $subject"
              status=1
            fi
          done <<< "$log"
          if [[ $TITLE =~ $pattern ]]; then
            echo "::error::Title: $TITLE"
            status=1
          fi
          if ((status)); then
            echo "::error::Squash them before the merge: git rebase -i --autosquash origin/main"
          fi
          exit "$status"
