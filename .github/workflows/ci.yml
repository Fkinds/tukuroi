name: CI
# Checks each change: it publishes nothing. The release gets a workflow of its
# own, without the caches of these jobs (#28).
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the run of the one before; the runs of
# main all finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # uv installs what uv.lock has, and fails if it does not match pyproject.toml.
  UV_LOCKED: "1"
  # The uv of CI, which builds the release too (#18).
  UV_VERSION: "0.13.7"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python-version:
          - "3.14"
          - "3.14t"
          - "3.15"
          - "3.15t"
        include:
          - os: macos-15
            python-version: "3.14"
          - os: macos-15
            python-version: "3.15"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: ${{ matrix.python-version }}
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: make SYNC="--extra lsp" install
      - name: Test
        # The tests, measured: fails below fail_under of pyproject.toml (#10),
        # on each version and system.
        run: make SYNC="--extra lsp" coverage
      - name: Summary
        # The table, on the page of the run: the data is not sent anywhere.
        if: always()
        run: uv run --no-sync coverage report --format=markdown --fail-under=0 >> "$GITHUB_STEP_SUMMARY"

  pyrefly:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
      - name: Install
        run: make SYNC= install
      - name: Pyrefly
        run: uv run pyrefly check -c pyproject.toml

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
      - name: Install
        run: make SYNC= install
      - name: Hooks
        # The checks of prek.toml, which has those of `make lint` too (#9), for
        # the commits made without the hook. zizmor runs in the next step.
        env:
          SKIP: zizmor
        run: uv run prek run --all-files
      - name: Workflows
        # zizmor of prek.toml, with the checks that ask GitHub too: that each
        # action is pinned to a commit of its own repository, that the comment
        # has the version of the commit, and that no action has a known
        # vulnerability (#28). The token reads public repositories only.
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run zizmor --format=github .github/workflows

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
      - name: Install
        run: make SYNC="--group docs" install
      - name: Docs
        run: make SYNC="--group docs" html
      - name: Generated changes
        run: git diff --exit-code

  build:
    # That the package builds, as the release will build it.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          # Nothing that an earlier run left goes into the build (#18).
          enable-cache: false
          python-version: "3.14"
      - name: Build
        # The build backend of build-constraints.txt, checked by its hashes: a
        # preview feature of uv 0.13.5, whose version CI fixes (UV_VERSION).
        run: >-
          uv build --no-cache
          --build-constraints build-constraints.txt --require-build-hashes
          --preview-features build-dependency-hashes

  required:
    # The check that the ruleset of main requires (#11), in place of each job:
    # it passes when every job of needs passed. A new job goes into needs.
    if: always()
    needs: [test, pyrefly, lint, docs, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Results
        env:
          NEEDS: ${{ toJSON(needs) }}
        shell: bash
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<< "$NEEDS")
          if [[ -n $failed ]]; then
            while read -r line; do
              echo "::error::$line"
            done <<< "$failed"
            exit 1
          fi
