name: CI
on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:

permissions:
  contents: read

env:
  # uv installs what uv.lock has, and fails if it does not match pyproject.toml.
  UV_LOCKED: "1"
  # The uv of CI, which builds the release too (#18).
  UV_VERSION: "0.13.5"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.14"
          - "3.14t"
          - "3.15"
          - "3.15t"
        os: [ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: ${{ matrix.python-version }}
          python-version: ${{ matrix.python-version }}
          activate-environment: true
      - name: Install
        run: make SYNC="--extra lsp" install
      - name: Test
        run: make SYNC="--extra lsp" test

  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          activate-environment: true
      - name: Install
        run: make SYNC="--extra lsp" install
      - name: Coverage
        # Fails below fail_under of pyproject.toml (#10).
        run: make SYNC="--extra lsp" coverage
      - name: Summary
        # The table, on the page of the run: the data is not sent anywhere.
        if: always()
        run: uv run coverage report --format=markdown --fail-under=0 >> "$GITHUB_STEP_SUMMARY"

  pyrefly:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          activate-environment: true
      - name: Install
        run: make SYNC= install
      - name: Pyrefly
        run: uv run pyrefly check -c pyproject.toml

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          activate-environment: true
      - name: Install
        run: make SYNC= install
      - name: Lint
        run: make SYNC= lint
      - name: Hooks
        # The checks of prek.toml, for the commits made without the hook (#9).
        run: uv run prek run --all-files

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          activate-environment: true
      - name: Install
        run: make SYNC="--group docs" install
      - name: Docs
        run: make SYNC="--group docs" html
      - name: Generated changes
        run: git diff --exit-code

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          # Nothing that an earlier run left goes into the release (#18).
          enable-cache: false
          python-version: '3.14'
      - name: Build
        # The build backend of build-constraints.txt, checked by its hashes: a
        # preview feature of uv 0.13.5, whose version CI fixes (UV_VERSION).
        run: >-
          uv build --no-cache
          --build-constraints build-constraints.txt --require-build-hashes
          --preview-features build-dependency-hashes
      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Fkinds/Fixit never publishes anywhere. Only upstream publishes to PyPI.
    if: github.repository == 'Instagram/Fixit' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
