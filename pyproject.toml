[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "fixit"
readme = "README.rst"
authors = [
    {name="Meta Platforms, Inc"},
    {name="Amethyst Reese"},
    {name="Jimmy Lai"},
    {name="Zsolt Dollenstein"},
]
license = {file="LICENSE"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
]

requires-python = ">=3.14"
dependencies = [
    "click >= 8.3.3, < 9",
    "moreorless >= 0.4.0",
    "ruff >= 0.17.3",
    "trailrunner >= 1.2",
]

dynamic = ["version"]
description = "A lint framework that writes better Python code for you."

[project.optional-dependencies]
lsp = [
    "pygls ~= 2.0.0",
]
pretty = [
    "rich >= 12.6.0",
]

# The tools to develop Fixit with (PEP 735): not part of the package (#8). uv
# installs dev by default; `make install` installs docs too.
[dependency-groups]
dev = [
    "attribution == 1.8.0",
    "commitizen == 4.19.3",
    "coverage == 7.17.2",
    "prek == 0.5.10",
    "ruff == 0.17.4",
    "pyrefly == 0.63.1",
    "zizmor == 1.32.0",
]
docs = [
    "jinja2 == 3.1.6",
    "sphinx == 8.0.2",
    "sphinx-mdinclude == 0.6.2",
]

[project.scripts]
fixit = "fixit.cli:main"

[project.urls]
Home = "https://fixit.rtfd.io"
Github = "https://github.com/Instagram/Fixit"
Changelog = "https://github.com/Instagram/Fixit/blob/main/CHANGELOG.md"

[tool.attribution]
name = "Fixit"
package = "fixit"
signed_tags = true
version_file = false
ignored_authors = ["dependabot"]

# The uv to develop with (#18): CI uses the one of UV_VERSION in its workflows.
[tool.uv]
required-version = ">=0.13.5"

# The vulnerabilities that `make audit` leaves out (#25): each with its reason
# and its issue, in a comment. `ignore-until-fixed` only while no release fixes
# the vulnerability.
[tool.uv.audit]
ignore = []
ignore-until-fixed = []

# `make coverage` (#10): the lines and branches of the package that the tests
# run, in the processes of the pool of `lint` and in subprocesses too.
[tool.coverage.run]
branch = true
source = ["fixit"]
omit = ["*/fixit/tests/*"]
concurrency = ["thread", "multiprocessing"]
patch = ["subprocess"]
parallel = true

[tool.coverage.report]
# Every line and branch (#116): a new one needs a test, or else the code that
# cannot run raises AssertionError with the reason (exclude_also below).
fail_under = 100
show_missing = true
skip_covered = true
# What cannot run by the design of the code, with the reason in the message
# (#116): not to be tested.
exclude_also = ["raise AssertionError", "assert_never\\("]

# `cz check` (#24): Conventional Commits 1.0.0, with the types of commitlint's
# config-conventional, and the first line up to 100 characters, as it has. The
# pattern checks the length too: `cz check` of commitizen 4.19.3 does not read
# message_length_limit.
[tool.commitizen]
name = "cz_customize"

[tool.commitizen.customize]
schema = "<type>(<scope>)!: <description>"
schema_pattern = "(?m)^(?=.{1,100}$)(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\\([^()\\s]+\\))?!?: \\S"
example = "fix(config): stop at the first value that fixit cannot use"

[tool.ruff.lint.per-file-ignores]
# Package modules re-export names.
"__init__.py" = ["F401"]

[tool.fixit]
root = true
enable = ["fixit.rules"]

[[tool.fixit.overrides]]
path = "examples"
enable = [".examples.noop"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/fixit/__version__.py"

[tool.hatch.build]
exclude = [
    "/.github",
    "/examples",
    "/legacy",
]

[tool.pyrefly]
project_includes = [
    # Start by adding a single file and we'll expand as we go
    "src/fixit/util.py"
]
search_path = [
    "src"
]
python_version = "3.12"
