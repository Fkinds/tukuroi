[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "tukuroi"
readme = "README.rst"
authors = [
    {name="Meta Platforms, Inc"},
    {name="Amethyst Reese"},
    {name="Jimmy Lai"},
    {name="Zsolt Dollenstein"},
]
maintainers = [
    {name="Fkinds"},
]
license = {file="LICENSE"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
]

requires-python = ">=3.14"
dependencies = [
    "click >= 8.3.3, < 9",
    "moreorless >= 0.4.0",
    # .gitignore, as git reads it (#197).
    "pathspec >= 1.0",
]

dynamic = ["version"]
description = "A lint framework that writes better Python code for you."

[project.optional-dependencies]
lsp = [
    "pygls ~=2.1.1",
]
# ruff format for the fixed files, with formatter = "ruff" (#108).
ruff = [
    "ruff >= 0.17.3",
]
pretty = [
    "rich >= 12.6.0",
]

# The tools to develop tukuroi with (PEP 735): not part of the package (#8). uv
# installs dev by default; `make install` installs docs too.
[dependency-groups]
dev = [
    # PyYAML has no wheels for Python 3.15 yet, and uv builds nothing from
    # source (#136): commitizen, which needs PyYAML, and PyYAML stay out of
    # 3.15. Drop the markers once PyYAML has wheels for 3.15.
    "commitizen ==4.19.4; python_version < '3.15'",
    "coverage ==7.17.4",
    "prek ==0.5.11",
    "ruff ==0.17.6",
    "pyrefly ==1.5.0",
    # scripts/repository_settings.py reads .github/repository.yml.
    "pyyaml ==6.0.4; python_version < '3.15'",
    "zizmor ==1.33.1",
    # lint-imports checks the boundary of the engine (#169).
    "import-linter ==2.17",
]
docs = [
    "jinja2 == 3.1.6",
    "sphinx == 9.2.0",
    "sphinx-mdinclude == 0.6.2",
]

[project.scripts]
tukuroi = "tukuroi.cli:main"

# The plugins of tukuroi itself (#169), registered as those of other
# distributions are: `formatter = "<name>"` of a config.
[project.entry-points."tukuroi.formatters"]
ruff = "tukuroi.core.format:RuffFormatter"

[project.entry-points."tukuroi.output_formats"]
custom = "tukuroi.output:CustomFormat"
json = "tukuroi.documents:JsonFormat"
sarif = "tukuroi.documents:SarifFormat"
tukuroi = "tukuroi.output:TukuroiFormat"
vscode = "tukuroi.output:VscodeFormat"

[project.urls]
Home = "https://github.com/Fkinds/tukuroi"
Documentation = "https://fkinds.github.io/tukuroi/"
Github = "https://github.com/Fkinds/tukuroi"
Changelog = "https://github.com/Fkinds/tukuroi/blob/main/CHANGELOG.md"

# The uv to develop with (#18): CI uses the one of UV_VERSION in its workflows.
[tool.uv]
required-version = ">=0.13.5"
# Each dependency is installed from a wheel, and none is built from its source
# distribution, whose build dependencies no lock pins (#136): a dependency
# without a wheel for a version of Python fails `uv sync` there. tukuroi itself
# is built still, as the release builds it (#18).
no-build = true

# The vulnerabilities that `make audit` leaves out (#25): each with its reason
# and its issue, in a comment. `ignore-until-fixed` only while no release fixes
# the vulnerability.
[tool.uv.audit]
ignore = []
ignore-until-fixed = []

# `make coverage` (#10): the lines and branches of the package that the tests
# run, in the processes of the pool of `lint` and in subprocesses too.
[tool.coverage.run]
branch = true
source = ["tukuroi"]
omit = ["*/tukuroi/tests/*"]
concurrency = ["thread", "multiprocessing"]
patch = ["subprocess"]
parallel = true

# The boundary of the engine (#169): tukuroi.core imports nothing else of
# tukuroi, and the built-in rules import only the engine. A new module of
# tukuroi goes into the modules that they do not import. `make lint` and prek
# check it with lint-imports.
[tool.importlinter]
root_package = "tukuroi"

[[tool.importlinter.contracts]]
name = "The engine imports nothing else of tukuroi"
type = "forbidden"
source_modules = ["tukuroi.core"]
forbidden_modules = [
    "tukuroi.api",
    "tukuroi.cli",
    "tukuroi.config",
    "tukuroi.config_values",
    "tukuroi.documents",
    "tukuroi.ftypes",
    "tukuroi.lsp",
    "tukuroi.output",
    "tukuroi.plugins",
    "tukuroi.pool",
    "tukuroi.template",
    "tukuroi.testing",
    "tukuroi.tests",
    "tukuroi.util",
    "tukuroi.walk",
    "tukuroi.rules",
]

[[tool.importlinter.contracts]]
name = "The built-in rules import only the engine"
type = "forbidden"
source_modules = ["tukuroi.rules"]
forbidden_modules = [
    "tukuroi.api",
    "tukuroi.cli",
    "tukuroi.config",
    "tukuroi.config_values",
    "tukuroi.documents",
    "tukuroi.ftypes",
    "tukuroi.lsp",
    "tukuroi.output",
    "tukuroi.plugins",
    "tukuroi.pool",
    "tukuroi.template",
    "tukuroi.testing",
    "tukuroi.tests",
    "tukuroi.util",
    "tukuroi.walk",
]

[tool.coverage.report]
# Every line and branch (#116): a new one needs a test, or else the code that
# cannot run raises AssertionError with the reason (exclude_also below).
fail_under = 100
show_missing = true
skip_covered = true
# What cannot run by the design of the code, with the reason in the message
# (#116): not to be tested.
exclude_also = ["raise AssertionError", "assert_never\\("]

# `cz check` (#24): Conventional Commits 1.0.0, with the types of commitlint's
# config-conventional, and the first line up to 100 characters, as it has. The
# pattern checks the length too: `cz check` of commitizen 4.19.3 does not read
# message_length_limit.
[tool.commitizen]
name = "cz_customize"
# The version is that of the tag v* (hatch-vcs). The tags of upstream, before
# tukuroi, are not its versions.
version_provider = "scm"
tag_format = "v$version"
ignored_tag_formats = ["v0.*", "v2.*"]
# `cz changelog` adds the section of the next version to CHANGELOG.md: see
# "Releasing" in CONTRIBUTING.md.
changelog_incremental = true

[tool.commitizen.customize]
schema = "<type>(<scope>)!: <description>"
schema_pattern = "(?m)^(?=.{1,100}$)(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\\([^()\\s]+\\))?!?: \\S"
example = "fix(config): stop at the first value that tukuroi cannot use"
# The changelog: the first line of the commits that change what the users of
# tukuroi see, and the paragraphs of BREAKING CHANGE. Merge commits, and the
# other types, are not in it.
changelog_pattern = "^((feat|fix|perf|revert)(\\([^()\\s]+\\))?!?|\\w+(\\([^()\\s]+\\))?!):"
commit_parser = "^(?P<change_type>feat|fix|perf|revert|BREAKING CHANGE)(\\((?P<scope>[^()\\s]+)\\))?!?:\\s(?P<message>.*)"
change_type_order = ["BREAKING CHANGE", "Feat", "Fix", "Perf", "Revert"]

[tool.commitizen.customize.change_type_map]
feat = "Feat"
fix = "Fix"
perf = "Perf"
revert = "Revert"

# ruff's default rules, and the checks of bandit that ruff has (#130): its
# stable rules, not those of preview.
[tool.ruff.lint]
extend-select = ["S"]

[tool.ruff.lint.per-file-ignores]
# Package modules re-export names.
"__init__.py" = ["F401"]
# The tests narrow types with assert, and run tukuroi in a subprocess with
# sys.executable.
"src/tukuroi/tests/*" = ["S101", "S603"]

[tool.tukuroi]
root = true
enable = ["tukuroi.rules"]
formatter = "ruff"

[[tool.tukuroi.overrides]]
path = "examples"
enable = [".examples.noop"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/tukuroi/__version__.py"

[tool.hatch.build]
exclude = [
    "/.github",
    "/examples",
    "/legacy",
]

# All the code of tukuroi (#179): the package with its tests, the scripts, and
# the config of the docs. examples/ is text to lint, with errors on purpose.
# `make typecheck` checks it on the oldest Python that tukuroi supports, here,
# and on the newest.
[tool.pyrefly]
project_includes = ["src/tukuroi", "scripts", "docs/conf.py"]
# scripts/: its tests import the scripts by name, as `make test-scripts` runs them.
search_path = ["src", "scripts"]
python_version = "3.14"

# An ignore that is not needed any more is an error (#179).
[tool.pyrefly.errors]
unused-ignore = true
unused-type-ignore = true
