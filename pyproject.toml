[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "fixit"
readme = "README.rst"
authors = [
    {name="Meta Platforms, Inc"},
    {name="Amethyst Reese"},
    {name="Jimmy Lai"},
    {name="Zsolt Dollenstein"},
]
license = {file="LICENSE"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
]

requires-python = ">=3.14"
dependencies = [
    "click >= 8.3.3, < 9",
    "moreorless >= 0.4.0",
    "ruff >= 0.17.3",
    "trailrunner >= 1.2",
]

dynamic = ["version"]
description = "A lint framework that writes better Python code for you."

[project.optional-dependencies]
lsp = [
    "pygls ~= 2.0.0",
]
pretty = [
    "rich >= 12.6.0",
]

# The tools to develop Fixit with (PEP 735): not part of the package (#8). uv
# installs dev by default; `make install` installs docs too.
[dependency-groups]
dev = [
    "attribution == 1.8.0",
    "prek == 0.5.10",
    "ruff == 0.17.4",
    "pyrefly == 0.63.1",
]
docs = [
    "jinja2 == 3.1.6",
    "sphinx == 8.0.2",
    "sphinx-mdinclude == 0.6.2",
]

[project.scripts]
fixit = "fixit.cli:main"

[project.urls]
Home = "https://fixit.rtfd.io"
Github = "https://github.com/Instagram/Fixit"
Changelog = "https://github.com/Instagram/Fixit/blob/main/CHANGELOG.md"

[tool.attribution]
name = "Fixit"
package = "fixit"
signed_tags = true
version_file = false
ignored_authors = ["dependabot"]

[tool.ruff.lint.per-file-ignores]
# Package modules re-export names.
"__init__.py" = ["F401"]

[tool.fixit]
root = true
enable = ["fixit.rules"]

[[tool.fixit.overrides]]
path = "examples"
enable = [".examples.noop"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/fixit/__version__.py"

[tool.hatch.build]
exclude = [
    "/.github",
    "/examples",
    "/legacy",
]

[tool.pyrefly]
project_includes = [
    # Start by adding a single file and we'll expand as we go
    "src/fixit/util.py"
]
search_path = [
    "src"
]
python_version = "3.12"
