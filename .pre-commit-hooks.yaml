- id: tukuroi-lint
  name: tukuroi - lint
  description: This hook shows tukuroi lints and suggested changes without applying autofixes.
  entry: tukuroi lint --diff
  language: python
  types: [python]
- id: tukuroi-fix
  name: tukuroi - lint and apply autofixes
  description: This hook shows tukuroi lints and applies suggested changes.
  entry: tukuroi fix --automatic
  language: python
  types: [python]
